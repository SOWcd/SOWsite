<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тест выравнивания кнопок</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #151515;
      --border: rgba(255,255,255,0.06);
      --white: #ffffff;
      --gray-2: #a0a0a0;
      --radius: 20px;
    }
    
    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    
    .test-container {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .channel-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 200px;
    }
    
    .channel-block__title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 6px;
    }
    
    .channel-block__subtitle {
      font-size: 11px;
      color: var(--gray-2);
      margin-bottom: 20px;
    }
    
    .channel-block__platforms {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    
    /* Левый блок - кнопки слева */
    .left-block .channel-block__platforms {
      justify-content: flex-start !important;
      border: 2px solid red; /* для наглядности */
      padding: 5px;
      border-radius: 8px;
    }
    
    /* Правый блок - кнопки справа */
    .right-block .channel-block__platforms {
      justify-content: flex-end !important;
      border: 2px solid blue; /* для наглядности */
      padding: 5px;
      border-radius: 8px;
    }
    
    .platform-link {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--white);
      transition: all 0.25s ease;
    }
    
    .platform-link:hover {
      background: #3b82f6;
      transform: translateY(-2px);
    }
    
    .platform-link svg {
      width: 20px;
      height: 20px;
    }
    
    .platform-link--youtube:hover { background: #ff0000; }
    .platform-link--tiktok:hover { background: #00f2ea; }
    .platform-link--instagram:hover { background: #e1306c; }
    
    h1 {
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      margin-bottom: 20px;
    }
    
    .description {
      text-align: center;
      color: var(--gray-2);
      margin-bottom: 40px;
    }
  </style>
</head>
